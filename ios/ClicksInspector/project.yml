name: ClicksInspector
configs:
  Debug: debug
  Release: release
  AuthorizedStockUpdate: release
  StockFirmwareManager: release
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
targets:
  ClicksInspector:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - ck5200_qmk.bin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.clicks-inspector
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "4"
      configs:
        AuthorizedStockUpdate:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STOCK_FIRMWARE_MANAGER"
        StockFirmwareManager:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STOCK_FIRMWARE_MANAGER"
    dependencies:
      - sdk: ExternalAccessory.framework
      - sdk: GameController.framework
  ClicksInspectorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.clicks-inspector.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: ClicksInspector
  ClicksInspectorAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.clicks-inspector.apptests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: ClicksInspector
schemes:
  StockFirmwareManager:
    build:
      targets:
        ClicksInspector: all
    test:
      config: StockFirmwareManager
      targets:
        - ClicksInspectorUITests
  ClicksInspector:
    build:
      targets:
        ClicksInspector: all
    test:
      targets:
        - ClicksInspectorAppTests
        - ClicksInspectorUITests
