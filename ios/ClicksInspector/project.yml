name: ClicksInspector
configs:
  Debug: debug
  Release: release
  AuthorizedStockUpdate: release
  StockFirmwareManager: release
  QMKKeymap: debug
  StockFlashTrial: release
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
targets:
  ClicksInspector:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - ck5200_qmk.bin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.clicks-inspector
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "4"
      configs:
        AuthorizedStockUpdate:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STOCK_FIRMWARE_MANAGER"
        StockFirmwareManager:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STOCK_FIRMWARE_MANAGER"
        StockFlashTrial:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STOCK_FLASH_TRIAL STOCK_FIRMWARE_MANAGER"
        QMKKeymap:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) QMK_RAM_KEYMAP"
          SWIFT_OBJC_BRIDGING_HEADER: "Tests/QMKBridge.h"
          "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": ["$(inherited)", "$(DERIVED_FILE_DIR)"]
          "OTHER_LDFLAGS[sdk=iphonesimulator*]": "$(inherited) -lQMKBridge"
    preBuildScripts:
      - name: Build production QMK simulator bridge
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ "$CONFIGURATION" = QMKKeymap ] && [ "$PLATFORM_NAME" = iphonesimulator ]; then
            for ARCH in $ARCHS; do
              bash "$SRCROOT/Tests/build-qmk-bridge.sh" "$DERIVED_FILE_DIR/qmk-$ARCH" "$ARCH"
            done
            # Xcode's derived-file path can contain spaces. Use positional arguments.
            set --
            for ARCH in $ARCHS; do
              set -- "$@" "$DERIVED_FILE_DIR/qmk-$ARCH/libQMKBridge.a"
            done
            xcrun lipo -create "$@" -output "$DERIVED_FILE_DIR/libQMKBridge.a"
          fi
    dependencies:
      - sdk: ExternalAccessory.framework
      - sdk: GameController.framework
  ClicksInspectorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.clicks-inspector.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: ClicksInspector
  ClicksInspectorAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.clicks-inspector.apptests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: ClicksInspector
schemes:
  StockFirmwareManager:
    build:
      targets:
        ClicksInspector: all
    test:
      config: StockFirmwareManager
      targets:
        - ClicksInspectorUITests
  ClicksInspector:
    build:
      targets:
        ClicksInspector: all
    test:
      targets:
        - ClicksInspectorAppTests
        - ClicksInspectorUITests
