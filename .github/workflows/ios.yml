name: Clicks Inspector iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/ClicksInspector/**"
      - ".github/workflows/ios.yml"
      - "**/*.md"
      - "scripts/check-readiness.py"
      - "keyboards/ck5200/firmware/**"
      - "keyboards/ck5200/scripts/pins.env"
      - "keyboards/ck5200/tests/qmk_shim/**"
  pull_request:
    paths:
      - "ios/ClicksInspector/**"
      - ".github/workflows/ios.yml"
      - "**/*.md"
      - "scripts/check-readiness.py"
      - "keyboards/ck5200/firmware/**"
      - "keyboards/ck5200/scripts/pins.env"
      - "keyboards/ck5200/tests/qmk_shim/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install project generator
        run: brew install xcodegen
      - name: Fetch pinned C integration dependencies
        run: |
          source keyboards/ck5200/scripts/pins.env
          git init keyboards/ck5200/external/qmk_firmware
          git -C keyboards/ck5200/external/qmk_firmware fetch --depth 1 https://github.com/qmk/qmk_firmware.git "$QMK_COMMIT"
          git -C keyboards/ck5200/external/qmk_firmware checkout --detach FETCH_HEAD
          git init keyboards/ck5200/external/sha-2
          git -C keyboards/ck5200/external/sha-2 fetch --depth 1 https://github.com/amosnier/sha-2.git "$SHA256_COMMIT"
          git -C keyboards/ck5200/external/sha-2 checkout --detach FETCH_HEAD
      - name: Record toolchain and revision
        run: |
          mkdir -p evidence
          { git rev-parse HEAD; xcodebuild -version; xcrun swiftc --version; xcodegen --version; } 2>&1 | tee evidence/toolchain.log
      - name: Check readiness documentation
        run: python3 scripts/check-readiness.py
      - name: Reproduce red regressions on review target
        run: |
          set -o pipefail
          python3 ios/ClicksInspector/Tests/reproduce_red.py 2>&1 | tee evidence/red-regressions.log
      - name: Run Swift tests and recorder benchmark
        run: |
          set -o pipefail
          bash ios/ClicksInspector/test.sh 2>&1 | tee evidence/swift-tests.log
      - name: Build unsigned diagnostics-only iPhone application
        run: |
          set -o pipefail
          xcodegen generate --spec ios/ClicksInspector/project.yml
          xcodebuild -project ios/ClicksInspector/ClicksInspector.xcodeproj \
            -scheme ClicksInspector -configuration Debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee evidence/iphone-build.log
      - name: Build unsigned simulator application
        run: |
          set -o pipefail
          xcodegen generate --spec ios/ClicksInspector/project.yml 2>&1 | tee evidence/generate.log
          xcodebuild -project ios/ClicksInspector/ClicksInspector.xcodeproj \
            -scheme ClicksInspector -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee evidence/simulator-build.log
      - name: Test recording, export, and deletion in Simulator
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,items in d["devices"].items() if ".iOS-" in runtime for x in items if x["name"].startswith("iPhone")))')
          echo "UI_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild -project ios/ClicksInspector/ClicksInspector.xcodeproj \
            -scheme ClicksInspector -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO -resultBundlePath evidence/ui-tests.xcresult \
             CODE_SIGNING_ALLOWED=NO test 2>&1 | tee evidence/ui-tests.log
      - name: Retain source exports from simulator storage
        if: always() && env.UI_DEVICE_ID != ''
        run: |
          mkdir -p evidence/source-exports
          # Xcode can shut down the device or use a test clone. Read only the
          # explicit Debug UI-test snapshots, without requiring a running device.
          find "$HOME/Library/Developer/CoreSimulator/Devices" -type f \
            -path '*/data/Containers/Data/Application/*/tmp/stock-export-ui-evidence/stock-*-*.json' \
            -print -exec cp '{}' evidence/source-exports/ \;
      - name: Extract UI captures from test results
        if: always() && env.UI_DEVICE_ID != ''
        run: |
          xcrun xcresulttool export attachments --path evidence/ui-tests.xcresult --output-path evidence/ui-attachments
      - name: Compare exported source bytes with UI capture
        if: always() && env.UI_DEVICE_ID != ''
        run: |
          set -o pipefail
          python3 ios/ClicksInspector/Tests/compare_ui_export.py evidence/source-exports evidence/ui-attachments \
            2>&1 | tee evidence/source-ui-comparison.log
      - name: Build and package the write-disabled stock manager
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,items in d["devices"].items() if ".iOS-" in runtime for x in items if x["name"].startswith("iPhone")))')
          xcodebuild -project ios/ClicksInspector/ClicksInspector.xcodeproj \
            -scheme StockFirmwareManager -configuration StockFirmwareManager \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/stock-manager" \
            -resultBundlePath evidence/StockManagerUITests.xcresult \
            -only-testing:ClicksInspectorUITests/StockManagerUITests \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee evidence/stock-manager-ui-tests.log
          for PLATFORM in 'iOS' 'iOS Simulator'; do
            xcodebuild -project ios/ClicksInspector/ClicksInspector.xcodeproj \
              -scheme StockFirmwareManager -configuration StockFirmwareManager \
              -destination "generic/platform=$PLATFORM" -derivedDataPath "$RUNNER_TEMP/stock-manager" \
              CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "evidence/stock-manager-$PLATFORM-build.log"
          done
          for SDK in iphoneos iphonesimulator; do
            ditto -c -k --sequesterRsrc --keepParent \
              "$RUNNER_TEMP/stock-manager/Build/Products/StockFirmwareManager-$SDK/ClicksInspector.app" \
              "evidence/ClicksInspector-StockFirmwareManager-$SDK.zip"
          done
          shasum -a 256 evidence/ClicksInspector-StockFirmwareManager-*.zip > evidence/app-SHA256SUMS
      - name: Publish complete verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-verification-${{ github.sha }}
          path: evidence/
          retention-days: 30
