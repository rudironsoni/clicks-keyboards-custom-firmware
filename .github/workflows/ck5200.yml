name: CK-5200

on:
  workflow_dispatch:
  push:
    paths:
      - "keyboards/ck5200/**"
      - ".github/workflows/ck5200.yml"
  pull_request:
    paths:
      - "keyboards/ck5200/**"
      - ".github/workflows/ck5200.yml"

permissions:
  contents: read

concurrency:
  group: ck5200-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: keyboards/ck5200

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check runner tools
        run: |
          cmake --version
          ninja --version
          cc --version
          git --version
          curl --version

      - name: Set up toolchain and dependencies
        run: bash scripts/setup.sh

      - name: Establish hash-verified stock test fixture
        run: |
          bash scripts/revert-stock.sh --download-only
          sha256sum .stock/iKeyboard_CK-5200_V122_120.bin
          echo "expected 8ee86935f5fbd622972fa55033f29fa551ba572288123046e21d79006f3b22f8"
          echo "8ee86935f5fbd622972fa55033f29fa551ba572288123046e21d79006f3b22f8  .stock/iKeyboard_CK-5200_V122_120.bin" | sha256sum -c -

      # Order matters (review 2026-10-12, finding 5): the restore harness
      # consumes build/ck5200_qmk.bin and the stock fixture, so the
      # firmware must be built before the image-dependent integration
      # tests run. The fast unit tests are executed by the same script and
      # do not depend on the build artifacts.
      - name: Build firmware
        run: bash scripts/build.sh

      - name: Run tests
        run: bash scripts/test.sh

      - name: Execute exact firmware in the bounded assurance model
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p build/assurance
          python3 assurance/run.py --image build/ck5200_qmk.bin --elf build/ck5200_qmk.elf \
            2>&1 | tee build/assurance/ci.log
          test -s build/assurance/report.json

      - name: Retain binary assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ck5200-assurance
          if-no-files-found: warn
          path: |
            keyboards/ck5200/build/assurance/*.json
            keyboards/ck5200/build/assurance/*.jsonl
            keyboards/ck5200/build/assurance/*.log
            keyboards/ck5200/build/ck5200_qmk.bin
            keyboards/ck5200/build/ck5200_qmk.elf

      - name: Inspect firmware
        run: |
          TOOLCHAIN_BIN="$(find .toolchains -type f -name riscv-none-elf-objdump -print -quit | xargs dirname)"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          riscv-none-elf-size build/ck5200_qmk.elf
          riscv-none-elf-objdump -h build/ck5200_qmk.elf
          riscv-none-elf-objdump -d build/ck5200_qmk.elf > build/ck5200_qmk.disassembly.txt
          .venv/bin/python tools/validate_image.py build/ck5200_qmk.bin --elf build/ck5200_qmk.elf
          sha256sum build/ck5200_qmk.bin build/ck5200_qmk.elf

      - uses: actions/upload-artifact@v4
        with:
          name: ck5200-firmware
          path: |
            keyboards/ck5200/build/ck5200_qmk.bin
            keyboards/ck5200/build/ck5200_qmk.hex
            keyboards/ck5200/build/ck5200_qmk.elf
            keyboards/ck5200/build/ck5200_qmk.map
            keyboards/ck5200/build/ck5200_qmk.disassembly.txt
