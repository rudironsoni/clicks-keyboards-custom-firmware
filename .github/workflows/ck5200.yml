name: CK-5200

on:
  workflow_dispatch:
  push:
    paths:
      - "keyboards/ck5200/**"
      - ".github/workflows/ck5200.yml"
  pull_request:
    paths:
      - "keyboards/ck5200/**"
      - ".github/workflows/ck5200.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keyboards/ck5200

    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip gcc
          python3 -m pip install --break-system-packages pytest -r tools/requirements.txt

      - name: Install RISC-V embedded GCC
        run: |
          cd "$RUNNER_TEMP"
          curl -L --fail --retry 3             -o riscv.tar.gz             https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz
          echo "aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758  riscv.tar.gz" | sha256sum -c -
          tar -xzf riscv.tar.gz
          TOOLCHAIN_DIR="$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'xpack-riscv-none-elf-gcc-*' | head -n1)"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Bootstrap pinned dependencies
        run: scripts/bootstrap.sh

      - name: Run host protocol tests
        run: |
          python3 -m pytest -q tests/test_usb_protocol.py
          gcc -std=c11 -Wall -Wextra             tests/update_protocol_test.c             firmware/platform/ch32v20x/ck5200_update_protocol.c             -o /tmp/ck5200_update_protocol_test
          /tmp/ck5200_update_protocol_test

      - name: Build firmware
        run: scripts/build.sh

      - name: Inspect firmware
        run: |
          riscv-none-elf-size build/ck5200_qmk.elf
          riscv-none-elf-objdump -h build/ck5200_qmk.elf
          riscv-none-elf-objdump -d build/ck5200_qmk.elf > build/ck5200_qmk.disassembly.txt
          python3 tools/validate_image.py build/ck5200_qmk.bin
          sha256sum build/ck5200_qmk.bin build/ck5200_qmk.elf

      - uses: actions/upload-artifact@v4
        with:
          name: ck5200-firmware
          path: |
            keyboards/ck5200/build/ck5200_qmk.bin
            keyboards/ck5200/build/ck5200_qmk.hex
            keyboards/ck5200/build/ck5200_qmk.elf
            keyboards/ck5200/build/ck5200_qmk.map
            keyboards/ck5200/build/ck5200_qmk.disassembly.txt
